; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ===========================================================================
;  TARGET HARDWARE  -  the one line to change.
;
;  default_envs names the board `pio run` builds, and ONLY that one.  The other
;  environment stays defined and ready but is never compiled unless it is asked
;  for by name, so a normal build is one board's firmware and one board's build
;  time - swapping target is this line, not a source edit.
;
;    default_envs = cyd               ESP32-2432S028R "Cheap Yellow Display"
;    default_envs = esp32dev_ili9341  ESP32 Dev Module + discrete 2.8" ILI9341
;                                     + XPT2046
;    default_envs = esp32s3_es3c28p   2.8" IPS ESP32-S3 (ES3C28P/ES3N28P),
;                                     FT6336 capacitive touch on I2C
;
;  A one-off build of another board, without touching this file:
;      pio run -e esp32dev_ili9341 -t upload
;      pio run -e esp32s3_es3c28p  -t upload
;
;  The first two envs differ ONLY in the TFT_eSPI panel flags and the -D BOARD_*
;  that selects a header from include/boards/; everything else is shared in
;  [common].  The third is a different MCU (ESP32-S3, not ESP32) with a
;  different touch controller (FT6336 on I2C, not XPT2046 on SPI), so it also
;  overrides `board`, the S3-specific build.* settings and lib_deps - see
;  [env:esp32s3_es3c28p] below for exactly what and why.
;
;  default_envs is also what stops `pio run` from trying to build env:native,
;  which has no main() - the tests are its only entry point.
; ===========================================================================
[platformio]
; default_envs = esp32dev_ili9341
default_envs = cyd

; ---------------------------------------------------------------------------
;  Shared by all boards.  `board` and the S3-only build.*/upload_speed settings
;  are overridden per env where they differ (see [env:esp32s3_es3c28p]);
;  everything else - the LVGL/TFT_eSPI build flags and lib_deps - is common
;  because the firmware above Pins.h is the same on every board.
; ---------------------------------------------------------------------------
[common]
; Versions are PINNED on purpose.  An unpinned "espressif32" jumps to a release
; carrying Arduino core 3.x / IDF 5.x on the next `pio pkg update`, which changes
; SPIClass internals, the HSPI/FSPI enum values TFT_eSPI switches on, and the
; spi_host_device_t mapping.  Not something to discover mid-migration.
platform  = espressif32@7.0.1
board     = esp32dev
framework = arduino

; deep+ ensures the Library Dependency Finder resolves the cross-includes
; between the lib/ modules (ConfigManager, RfDetectors, PowerMath, MeterEngine,
; Ili9341Driver, LvglPort, Ui).
lib_ldf_mode = deep+

monitor_speed = 115200

build_flags =
	; The project include/ directory is only auto-added to the build path for
	; src/, NOT for libraries in lib/.  This -I makes the shared headers
	; (Types.h, AppConfig.h, Pins.h, boards/*.h) reachable from every module too.
	-I include

	; ---- bring-up instrumentation (define for bench builds, see lv_conf.h) ----
	; -D BRINGUP_STATS=1

	; ---- LVGL ------------------------------------------------------------
	; LVGL supports LV_CONF_PATH natively, so unlike TFT_eSPI it needs no file
	; copied into .pio/libdeps.  include/ is already on every module's include
	; path via the -I above.
	-D LV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"

	; ---- TFT_eSPI, the board-independent half -----------------------------
	; Configured entirely through build flags.  TFT_eSPI's own
	; User_Setup_Select.h wraps its body in `#ifndef USER_SETUP_LOADED`
	; precisely so PlatformIO users can do this, which is why the old
	; copy_user_setup.py extra_script (and User_Setup.h) are gone: being a
	; `pre:` script it ran BEFORE the library was downloaded, so the first
	; build of a clean checkout silently compiled with the stock pin map.
	;
	; The panel PINS, the driver variant and the bus clock are per board and
	; live in the two env sections below - they are the only thing that
	; differs.  Everything a panel does not care about stays here.
	-D USER_SETUP_LOADED=1

	; LVGL renders every glyph now, so TFT_eSPI's font engine is dead weight.
	; LOAD_GLCD (~1.8 KB) is kept only so a panic screen could still be drawn if
	; lv_init() ever failed.  Dropping FONT2/4/6/7/8, GFXFF and SMOOTH_FONT also
	; drops the FS/SPIFFS dependency SMOOTH_FONT dragged in.
	-D LOAD_GLCD=1

	; Read clock is the conservative one on both boards: reads come back through
	; a level shifter or a long jumper and are not on any hot path.
	-D SPI_READ_FREQUENCY=20000000

lib_deps =
	bodmer/TFT_eSPI@2.5.43
	lvgl/lvgl@^8.4.0
	https://github.com/PaulStoffregen/XPT2046_Touchscreen

; ===========================================================================
;  BOARD 1  -  ESP32-2432S028R "Cheap Yellow Display".
;
;  Everything is wired at the factory; these flags are a transcription of that
;  wiring, not a choice.  The rest of the CYD's hardware (touch bus, I2C, RGB
;  LED) is in include/boards/board_cyd.h.
; ===========================================================================
[env:cyd]
extends = common

build_flags =
	${common.build_flags}
	-D BOARD_CYD=1

	; The CYD's panel wants the ILI9341 ALTERNATIVE init sequence.
	-D ILI9341_2_DRIVER=1

	; TFT_MISO/MOSI/SCLK/CS below are the ESP32's native HSPI IO_MUX pins.
	; Without USE_HSPI_PORT, TFT_eSPI runs on VSPI and they route through the
	; GPIO matrix (which caps reliable SPI at ~40 MHz) - AND share the
	; peripheral with the XPT2046 (BOARD_TOUCH_SPI_BUS = VSPI in the board
	; header).  Harmless while nothing calls initDMA(); a hard requirement once
	; LVGL flushes over DMA, which it now does.  Pins.h refuses to compile a
	; board whose touch bus collides with this.
	-D USE_HSPI_PORT=1
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH

	; Back to 55 MHz now the port is stable.  It ran at 40 during the migration
	; so that "is this SPI corruption or is my flush_cb wrong?" was never a
	; question.  Note the meter screen is render-bound, not SPI-bound, so this
	; mostly helps full-screen repaints (screen changes), not steady state.
	; Safe here because the four SPI lines are PCB traces on IO_MUX pins.
	-D SPI_FREQUENCY=55000000

; ===========================================================================
;  BOARD 2  -  ESP32 Dev Module + discrete 2.8" ILI9341 + XPT2046 module
;              (the common red "TJCTM24028-SPI" style board).
;
;  Here the pin map IS the wiring instruction - the full harness, touch and I2C
;  included, is tabulated in include/boards/board_esp32_ili9341.h.  Wire to
;  match, or edit both places together.
;
;  The panel takes VSPI (whose IO_MUX pins 18/19/23 are the standard wiring for
;  these modules) and the touch controller takes HSPI - the mirror image of the
;  CYD, and the same invariant: the two never share a host, so a touch read can
;  never land on top of an in-flight DMA push.
; ===========================================================================
[env:esp32dev_ili9341]
extends = common

build_flags =
	${common.build_flags}
	-D BOARD_ESP32_ILI9341=1

	; Stock module: the STANDARD ILI9341 init sequence, not the CYD's variant.
	-D ILI9341_DRIVER=1

	; No USE_HSPI_PORT, so TFT_eSPI uses VSPI - both for the panel and, in
	; initDMA(), for the DMA host.  That is deliberate and not merely the
	; default: it is what leaves HSPI free for the XPT2046.
	-D TFT_MISO=19
	-D TFT_MOSI=23
	-D TFT_SCLK=18
	-D TFT_CS=5
	-D TFT_DC=2

	; A real reset line rather than the CYD's -1.  Tie RESET to EN and set this
	; to -1 if GPIO 4 is needed for something else.
	-D TFT_RST=4

	; The module's LED pin, driven by LEDC for brightness control.  If it is
	; tied straight to 3V3 instead, drop these two flags AND set
	; BOARD_HAS_BACKLIGHT_PWM to 0 in the board header.
	-D TFT_BL=27
	-D TFT_BACKLIGHT_ON=HIGH

	; 40 MHz, not the CYD's 55.  These signals cross dupont jumpers and a header
	; instead of a PCB trace, and marginal SPI does not fail cleanly - it shows
	; up as occasional wrong pixels that read like a driver bug.  With short
	; leads and a tidy layout 55 MHz is worth trying; treat it as a tuning knob,
	; not a default.
	-D SPI_FREQUENCY=40000000

; ===========================================================================
;  BOARD 3  -  2.8" IPS ESP32-S3 (QD electronic ES3C28P / ES3N28P kit).
;
;  A different MCU family from the two boards above (ESP32-S3, not ESP32) with
;  a different touch controller (FT6336 capacitive on I2C, not XPT2046
;  resistive on SPI) - see BOARD_TOUCH_IS_I2C in Pins.h and
;  include/boards/board_esp32s3_es3c28p.h for what that changes in the
;  firmware.  Everything else - the panel geometry, the LVGL setup, the
;  measurement chain - is the same firmware as the other two boards; this env
;  overrides `board`, adds the S3's native-USB and flash/PSRAM settings, and
;  drops XPT2046_Touchscreen from lib_deps since this board never uses it.
;
;  Pin map and every number below: include/boards/board_esp32s3_es3c28p.h and
;  the cyd-dev MCP index (cyd_pinout / cyd_gotchas, board=esp32s3-es3c28p).
; ===========================================================================
[env:esp32s3_es3c28p]
extends = common

; Overrides [common]'s `board = esp32dev` - this is a different chip package
; entirely, not a panel variant of the same ESP32-WROOM-32 the other two boards
; share.  `platform` and `framework` stay as [common] has them: espressif32@7.0.1
; already supports esp32-s3-devkitc-1, and pinning it is exactly as load-bearing
; here as it is for the other two boards (see the platform= comment in [common]).
board = esp32-s3-devkitc-1

upload_speed = 921600

; This board has NO USB-serial bridge: the Type-C port is the ESP32-S3's native
; USB peripheral, which only enumerates while firmware built with USB CDC on
; boot is running.  If the port disappears (e.g. after flashing broken
; firmware), hold BOOT (GPIO0) while plugging the cable in to force the ROM
; bootloader instead.
;
; No board_build.flash_mode here - it is left to the platform's default,
; matching the confirmed-working reference build for this exact board rather
; than an untested guess.  board_build.arduino.memory_type below is what
; actually needs to agree with the physical flash/PSRAM wiring; flash_mode and
; memory_type disagreeing is a more likely boot-time trap than omitting the
; former outright.
board_build.mcu          = esp32s3
board_upload.flash_size  = 16MB
board_build.partitions   = default_16MB.csv

; Works around a stock TFT_eSPI 2.5.43 bug: its ESP32-S3 DMA end-of-transfer
; callback writes to the wrong SPI/DMA register on every completed DMA push
; (classic-ESP32-only register math, see the script's header for the full
; diagnosis), which is exactly what LvglPort.cpp's overlapped flush exercises
; on every frame - and is why this board went to a blank white screen instead
; of drawing anything.  The vendor's kit ships a one-line patched fix for this
; (cyd-dev MCP: cyd_gotchas board=esp32s3-es3c28p topic=display); this script
; reapplies it to the fetched library automatically so a clean checkout builds
; correctly without a manual step.
extra_scripts = post:scripts/patch_tft_espi_s3_dma.py

build_flags =
	${common.build_flags}
	-D BOARD_ESP32S3_ES3C28P=1

	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

	; PSRAM: this connected board was identified by esptool as an ES3C28P
	; (8 MB OPI PSRAM) during upload, not the PSRAM-less ES3N28P, so this is
	; enabled to match - see board_build.arduino.memory_type below, which is
	; the setting that actually has to agree with it, and the PSRAM note near
	; the bottom of this env for what to do on an ES3N28P instead.
	-D BOARD_HAS_PSRAM

	; This panel is a stock ILI9341V - the standard driver, not the CYD's
	; ILI9341_2_DRIVER variant.
	-D ILI9341_DRIVER=1

	-D TFT_MISO=13
	-D TFT_MOSI=11
	-D TFT_SCLK=12
	-D TFT_CS=10
	-D TFT_DC=46
	-D TFT_RST=-1
	-D TFT_BL=45
	-D TFT_BACKLIGHT_ON=HIGH

	; Verified working value for this exact panel (cyd_gotchas), not a
	; conservative starting point the way the discrete board's 40 MHz is - so
	; unlike that board, this is not a knob to casually raise.
	-D SPI_FREQUENCY=40000000

	; Routes the panel off the GPIO matrix and onto IO_MUX pins, same purpose as
	; on the CYD - carried over from the cyd-dev reference build for this board
	; rather than re-derived, since getting this wrong on the S3's SPI2/SPI3
	; pin-matrix trades silent corruption for a build flag most projects never
	; have reason to touch.
	-D USE_HSPI_PORT=1

; XPT2046_Touchscreen from [common]'s lib_deps is never referenced on this
; board (BOARD_TOUCH_IS_I2C=1 compiles it out of Ili9341Driver entirely - see
; Pins.h), so it is dropped here rather than carried along unused.
lib_deps =
	bodmer/TFT_eSPI@2.5.43
	lvgl/lvgl@^8.4.0

; PSRAM (continued from -D BOARD_HAS_PSRAM in build_flags above): ON by
; default now that esptool has confirmed this connected board is an ES3C28P,
; matching the confirmed-working reference build for this exact board. This
; firmware's own memory budget (see AppConfig.h) does not need the extra 8 MB
; - it fits comfortably in internal DRAM either way - so this is about
; matching known-good hardware config, not about needing the RAM.
;
; On an ES3N28P (no PSRAM): delete -D BOARD_HAS_PSRAM above AND this line, or
; it crashes at boot (cyd_gotchas: psram).
board_build.arduino.memory_type = qio_opi

; ---------------------------------------------------------------------------
; Same board, built against FixedDetector instead of Ads1015Detector (see the
; ADC_FIXED_VALUES block in MeterEngine.cpp) - for bring-up with no ADC wired
; yet.  `extends` pulls in everything from the board env so this only has to
; state the difference: `pio run -e cyd_fixed`.  Point `extends` at
; env:esp32dev_ili9341 for the discrete build.
; ---------------------------------------------------------------------------
; [env:cyd_fixed]
; extends     = env:cyd
; build_flags =
; 	${env:cyd.build_flags}
; 	-D ADC_FIXED_VALUES

; ---------------------------------------------------------------------------
; Host tests.  `pio test -e native`
;
; PowerMath is the only module that can run here, and that is the whole point
; of it having no Arduino, no FreeRTOS and no LVGL: the physics is the part
; worth testing, and on the host it can be tested against hand-computed values
; instead of against whatever the bench happens to be transmitting.
;
; No BOARD_* is set and none is needed: nothing that reaches Pins.h is compiled
; here (see lib_ignore), which is also why a missing board is an #error there
; rather than a silent default that would quietly build the wrong pin map.
;
; test_build_src defaults to false, so src/main.cpp is never compiled here;
; lib_ignore keeps the LDF from following anything that needs the toolchain.
; ---------------------------------------------------------------------------
[env:native]
platform     = native
test_framework = unity
lib_ldf_mode = chain
lib_ignore   = Ui, LvglPort, Ili9341Driver, MeterEngine, ConfigManager, RfDetectors, FT6336
; UNITY_INCLUDE_DOUBLE is not on by default, and without it every
; TEST_ASSERT_DOUBLE_* aborts with "Unity Double Precision Disabled" rather
; than failing an assertion - which looks like broken math, not a missing flag.
;
; test/test_ads1015/fakes holds host stand-ins for <Arduino.h> and <Wire.h> -
; just enough of each for Ads1015Detector.cpp (excluded above via lib_ignore,
; same reason) to be #included directly by test_ads1015.cpp and driven against
; a simulated chip instead of hardware.  Harmless to the other two suites:
; neither includes Arduino.h or Wire.h, so the extra search path is never hit.
build_flags  = -I include -I test/test_ads1015/fakes -std=gnu++17 -D UNITY_INCLUDE_DOUBLE
